[gcode_macro G28]
rename_existing: G28.1
gcode:
    RUN_SHELL_COMMAND CMD=SOUND_HOME
    RUN_SHELL_COMMAND CMD=WLED_HOMING
    G28.1 {rawparams}
    RUN_SHELL_COMMAND CMD=WLED_STARTUP

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
	ATTACH_PROBE
    BED_MESH_CALIBRATE_BASE
    DOCK_PROBE
    RUN_SHELL_COMMAND CMD=SOUND_MESH

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE
gcode:
    SMARTHOME
    ATTACH_PROBE
    CENTRALIZE

    # Run the native calibration routine.
    # It will probe and leave the toolhead at the
    # position where the nozzle should be measured.
    _PROBE_CALIBRATE

    # Capture the exact position Klipper selected
    # after the probing operation.
    {% set x = printer.toolhead.position.x %}
    {% set y = printer.toolhead.position.y %}
    {% set z = printer.toolhead.position.z %}

    # Dock the probe
    DOCK_PROBE

    # Return to the exact calibration position
    G90
    G1 X{x} Y{y} Z{z} F3000