[gcode_macro G28]
rename_existing: G28.1
gcode:
    # If Z is already homed, move away from the bed first
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F1000
        G90
    {% endif %}

    # Check ZeroClick probe state
    QUERY_PROBE

    {% if not printer.probe.last_query %}
        # NC probe is OPEN = physically attached
        SET_GCODE_VARIABLE MACRO=ATTACH_PROBE VARIABLE=probe_attached VALUE=True
        RESPOND TYPE=error MSG="Homing blocked: ZeroClick probe is attached. Dock probe first!"
    {% else %}
        # NC probe is TRIGGERED = not attached
        SET_GCODE_VARIABLE MACRO=ATTACH_PROBE VARIABLE=probe_attached VALUE=False

        RUN_SHELL_COMMAND CMD=SOUND_HOME
        RUN_SHELL_COMMAND CMD=WLED_HOMING

        G28.1 {rawparams}

        RUN_SHELL_COMMAND CMD=WLED_STARTUP
    {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
	ATTACH_PROBE
    BED_MESH_CALIBRATE_BASE {rawparams}
    DOCK_PROBE

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE
gcode:
    SMARTHOME
    ATTACH_PROBE
    CENTRALIZE
    
    _PROBE_CALIBRATE

    DOCK_PROBE
    G90
    G1 X110 Y110 Z10 F3000

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY
gcode:
    SMARTHOME
    ATTACH_PROBE
    CENTRALIZE

    _PROBE_ACCURACY

    DOCK_PROBE

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE
gcode:
	SMARTHOME
    ATTACH_PROBE
    _SCREWS_TILT_CALCULATE {rawparams}
    DOCK_PROBE
    G1 Z20 F1200
    G1 Y200 F3000