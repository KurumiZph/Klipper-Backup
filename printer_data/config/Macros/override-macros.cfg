[gcode_macro G28]
rename_existing: G28.1
gcode:
    RUN_SHELL_COMMAND CMD=SOUND_HOME
    RUN_SHELL_COMMAND CMD=WLED_HOMING
    G28.1 {rawparams}
    RUN_SHELL_COMMAND CMD=WLED_STARTUP

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
	ATTACH_PROBE
    BED_MESH_CALIBRATE_BASE
    DOCK_PROBE
    RUN_SHELL_COMMAND CMD=SOUND_MESH

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE
gcode:
    SMARTHOME
    ATTACH_PROBE
    CENTRALIZE

    # Save the centralized position
    SAVE_GCODE_STATE NAME=PROBE_CALIBRATE_POS

    # Run Klipper's actual calibration routine
    _PROBE_CALIBRATE

    # Save the position Klipper left us at after probing
    GET_POSITION

    DOCK_PROBE

    # Return to the calibration position
    RESTORE_GCODE_STATE NAME=PROBE_CALIBRATE_POS MOVE=1

    # Apply probe X/Y offset so the nozzle is positioned
    # relative to the probe trigger point
    G91
    G1 X{printer.configfile.settings.probe.x_offset} Y{printer.configfile.settings.probe.y_offset} F3000
    G90