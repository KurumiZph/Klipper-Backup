[gcode_macro G28]
rename_existing: G28.1
gcode:
    RUN_SHELL_COMMAND CMD=SOUND_HOME
    RUN_SHELL_COMMAND CMD=WLED_HOMING
    G28.1 {rawparams}
    RUN_SHELL_COMMAND CMD=WLED_STARTUP

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
	ATTACH_PROBE
    BED_MESH_CALIBRATE_BASE
    DOCK_PROBE
    RUN_SHELL_COMMAND CMD=SOUND_MESH

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE
gcode:
    SMARTHOME
    ATTACH_PROBE
    CENTRALIZE

    # Remember the position CENTRALIZE selected
    {% set x = printer.toolhead.position.x %}
    {% set y = printer.toolhead.position.y %}

    # Run Klipper's calibration procedure
    _PROBE_CALIBRATE

    # Dock the probe
    DOCK_PROBE

    # Return to the calibration location
    G90
    G1 X{x} Y{y} F3000

    # Move nozzle relative to probe according to probe offset
    {% set xo = printer.configfile.settings.probe.x_offset|float %}
    {% set yo = printer.configfile.settings.probe.y_offset|float %}

    G1 X{x + xo} Y{y + yo} F3000