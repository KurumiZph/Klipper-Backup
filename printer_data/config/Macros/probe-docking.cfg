[gcode_macro ATTACH_PROBE]
description: Pick up ZeroClick probe
variable_clear_y: -24.0
variable_dock_x: -1.0
variable_pickup_z: 8.0
variable_pickup_x: 22.0
variable_safe_z: 10.0
gcode:
    G90
    SMARTHOME
    G1 Y{clear_y} F3000
    G1 X{dock_x} F3000
    G1 Z{pickup_z} F1000
    G1 X{pickup_x} F1000
    G1 Z{safe_z} F1000


[gcode_macro DOCK_PROBE]
description: Return ZeroClick probe to dock
variable_clear_y: -24.0
variable_dock_x: 0.0
variable_dock_z: 8.0
variable_release_x: 23.0
variable_safe_z: 5.0
gcode:
    G90
    G1 Z{safe_z} F1000
    G1 Y{clear_y} F3000
    G1 X{release_x} F3000
    G1 Z{dock_z} F1000
    G1 X{dock_x} F1000
    G1 Z{safe_z} F1000