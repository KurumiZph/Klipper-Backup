[gcode_macro ATTACH_PROBE]
description: Pick up ZeroClick probe
variable_probe_attached: False
variable_clear_y: -24.0
variable_dock_x: -1.0
variable_pickup_z: 8.0
variable_pickup_x: 22.0
variable_safe_z: 15.0
gcode:
    {% if printer["gcode_macro ATTACH_PROBE"].probe_attached %}
    RESPOND MSG="Probe already attached - skipping pickup"
    {% else %}
    G90
    SMARTHOME
    G1 Y{clear_y} F3000
    G1 X{dock_x} F3000
    G1 Z{pickup_z} F1000
    G1 X{pickup_x} F1000
    G1 Z{safe_z} F1000
	SET_GCODE_VARIABLE MACRO=ATTACH_PROBE VARIABLE=probe_attached VALUE=True
    RESPOND MSG="Probe attached"



[gcode_macro DOCK_PROBE]
description: Return ZeroClick probe to dock
variable_clear_y: -24.0
variable_dock_x: 0.0
variable_dock_z: 8.0
variable_release_x: 23.0
variable_safe_z: 10.0
gcode:
    G90
    G1 Z{safe_z} F1000
    G1 Y{clear_y} F3000
    G1 X{release_x} F3000
    G1 Z{dock_z} F1000
    G1 X{dock_x} F1000
    G1 Z{safe_z} F1000
    SET_GCODE_VARIABLE MACRO=ATTACH_PROBE VARIABLE=probe_attached VALUE=False
    RESPOND MSG="Probe docked"

[gcode_macro UPDATE_PROBE_STATE]
gcode:
    QUERY_PROBE

    {% if printer.probe.last_query %}
        SET_GCODE_VARIABLE MACRO=PROBE_STATE VARIABLE=attached VALUE=False
        RESPOND MSG="Probe: NOT ATTACHED"
    {% else %}
        SET_GCODE_VARIABLE MACRO=PROBE_STATE VARIABLE=attached VALUE=True
        RESPOND MSG="Probe: ATTACHED"
    {% endif %}