[gcode_macro DOCK_PROBE]
description: Dock ZeroClick probe
variable_dock_x: 10.0
variable_dock_y: -24.0
variable_dock_z: 15.0
variable_safe_z: 10.0
variable_approach_x: 20.0
gcode:
    {% set sx = printer["gcode_macro DOCK_PROBE"].safe_z %}
    {% set dx = printer["gcode_macro DOCK_PROBE"].dock_x %}
    {% set dy = printer["gcode_macro DOCK_PROBE"].dock_y %}
    {% set dz = printer["gcode_macro DOCK_PROBE"].dock_z %}
    {% set ax = printer["gcode_macro DOCK_PROBE"].approach_x %}

    SAVE_GCODE_STATE NAME=DOCK_PROBE_STATE

    G90

    # Raise to safe Z
    G1 Z{sx} F3000

    # Move beside the dock
    G1 X{ax} Y{dy} F6000

    # Move into docking position
    G1 X{dx} F3000

    # Lower to docking height
    G1 Z{dz} F1500

    # TODO: Replace these movements with your actual
    # ZeroClick docking sequence.
    #
    # Example:
    # G1 X{dx + 5} F1000
    # G1 X{dx} F1000

    # Retract from dock
    G1 X{ax} F3000

    RESTORE_GCODE_STATE NAME=DOCK_PROBE_STATE

[gcode_macro UNDOCK_PROBE]
description: Undock ZeroClick probe
variable_dock_x: 10.0
variable_dock_y: 200.0
variable_dock_z: 15.0
variable_safe_z: 10.0
variable_approach_x: 20.0
gcode:
    {% set sx = printer["gcode_macro UNDOCK_PROBE"].safe_z %}
    {% set dx = printer["gcode_macro UNDOCK_PROBE"].dock_x %}
    {% set dy = printer["gcode_macro UNDOCK_PROBE"].dock_y %}
    {% set dz = printer["gcode_macro UNDOCK_PROBE"].dock_z %}
    {% set ax = printer["gcode_macro UNDOCK_PROBE"].approach_x %}

    SAVE_GCODE_STATE NAME=UNDOCK_PROBE_STATE

    G90

    # Raise to safe Z
    G1 Z{sx} F3000

    # Move to dock approach position
    G1 X{ax} Y{dy} F6000

    # Enter dock
    G1 X{dx} F3000

    # Move to pickup height
    G1 Z{dz} F1500

    # TODO: Replace with actual ZeroClick pickup movement.
    #
    # Example:
    # G1 X{dx - 5} F1000
    # G1 X{dx} F1000

    # Pull probe out of dock
    G1 X{ax} F3000

    RESTORE_GCODE_STATE NAME=UNDOCK_PROBE_STATE