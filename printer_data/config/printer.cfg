#——————————————————————————| INCLUDES / ABILITIES |——————————————————————————#

# [include adxl.cfg]
[include mainsail.cfg]
[include shell_command.cfg]
[include Macros/main-macros.cfg]
[include KAMP/KAMP_Settings.cfg]
[include RPI Devices/rpi_devices.cfg]

[exclude_object]
[respond]


#————————————————————————————| MCU / HOST SETUP |————————————————————————————#

[idle_timeout]
timeout: 1800


[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command


[mcu rpi]
serial: /tmp/klipper_host_mcu


[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 90


#——————————————————————————————| PRINTER |——————————————————————————————#

[printer]
kinematics: cartesian

max_velocity: 250
max_accel: 4200

max_z_velocity: 15
max_z_accel: 15

square_corner_velocity: 12


#——————————————————————————————| STEPPERS |——————————————————————————————#

[stepper_x]
step_pin: PA12
dir_pin: PA11
enable_pin: !PA15

microsteps: 16
rotation_distance: 40

position_endstop: -7
position_min: -7
position_max: 235

homing_speed: 80
homing_retract_dist: 5

endstop_pin: !PH2


[stepper_y]
step_pin: PA9
dir_pin: PA8
enable_pin: !PA15

microsteps: 16
rotation_distance: 40

position_endstop: -24
position_min: -24
position_max: 213

homing_speed: 80
homing_retract_dist: 5

endstop_pin: ^!PC13


[stepper_z]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PA15

microsteps: 16
rotation_distance: 8

position_min: -10
position_max: 240

homing_speed: 8
second_homing_speed: 1
homing_retract_dist: 2

endstop_pin: ^PC14

# For use with the inductive probe as the Z endstop:
# endstop_pin: probe:z_virtual_endstop


[safe_z_home]
home_xy_position: 0, -24
speed: 70
z_hop: 20
z_hop_speed: 20


#——————————————————————————————| EXTRUDER |——————————————————————————————#

[extruder]
step_pin: PB15
dir_pin: PB14
enable_pin: !PA15

microsteps: 16
rotation_distance: 22.23426471
gear_ratio: 50:10
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: PB8
sensor_type: Generic 3950
sensor_pin: PC3

min_temp: 0
min_extrude_temp: 180
max_temp: 270

max_extrude_only_distance: 101.0
max_extrude_cross_section: 5

pressure_advance: 0.04
pressure_advance_smooth_time: 0.04


#—————————————————————————| FIRMWARE RETRACTION |—————————————————————————#

# [firmware_retraction]
# retract_length: 0.6
# retract_speed: 35
# unretract_extra_length: 0
# unretract_speed: 35


#——————————————————————————————| BED |——————————————————————————————#

[heater_bed]
heater_pin: PB9

sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1

min_temp: 0
max_temp: 120


#—————————————————————————| BED MESH |—————————————————————————#

[bed_mesh]
speed: 180
horizontal_move_z: 12

mesh_min: 10, 7
mesh_max: 216, 204

probe_count: 4, 4
zero_reference_position: 110, 110

mesh_pps: 3, 3

algorithm: bicubic
bicubic_tension: 0.2


#———————————————————————| SCREWS TILT ADJUST |———————————————————————#

[screws_tilt_adjust]
speed: 180
horizontal_move_z: 13

screw1: 50, 10
screw1_name: Front Left ↙

screw2: 215, 10
screw2_name: Front Right ↘

screw3: 215, 175
screw3_name: Rear Right ↗

screw4: 50, 175
screw4_name: Rear Left ↖

screw_thread: CCW-M4


#——————————————————————————————| PROBE |——————————————————————————————#

[probe]
pin: PA1

x_offset: -19
y_offset: 14
z_offset: 12

samples: 3
samples_result: average

samples_tolerance: 0.025
samples_tolerance_retries: 3

sample_retract_dist: 0.2

speed: 3
lift_speed: 10


#——————————————————————————————| FANS |——————————————————————————————#

# Motherboard cooling fan
[controller_fan motherboard]
pin: PB12


# Hotend heatsink fan
[heater_fan hotend]
pin: PB13


# Part cooling fan
[fan]
pin: PB5
max_power: 1.0


#——————————————————————————| HARDWARE ENABLE |——————————————————————————#

# This pin controls:
#   - Bed heater
#   - Hotend heater
#   - Extruder fan
#   - Part cooling fan

[output_pin enable_pin]
pin: PB6
value: 1


#——————————————————————————| OPTIONAL HARDWARE |——————————————————————————#

# Filament runout sensor
#
# [filament_switch_sensor filament_sensor]
# pause_on_runout: True
# event_delay: 3.0
# pause_delay: 0.5
# switch_pin: !PC15


# Beeper
# [output_pin beeper]
# pin: PB7


# Display / BL-related pins
# [output_pin bl_pin]
# pin: PC0

# [output_pin tft_rst]
# pin: PB4


#———————————————————————————| INPUT SHAPER |———————————————————————————#

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 45.6

shaper_type_y: mzv
shaper_freq_y: 36.2


